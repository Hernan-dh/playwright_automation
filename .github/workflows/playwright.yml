name: Playwright QA
on:
  pull_request: {}
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1-5'
  workflow_dispatch: {}
jobs:
  repository-verification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: python scripts/verify.py
  smoke:
    needs: repository-verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
  portfolio-showcase:
    if: github.event_name == 'workflow_dispatch'
    needs: repository-verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run showcase
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: portfolio-showcase, path: portfolio-artifacts, retention-days: 14 }
  container-validation:
    needs: repository-verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag playwright-qa-portfolio:test .
      - run: docker run --rm playwright-qa-portfolio:test npm run test:network
      - run: docker run --rm playwright-qa-portfolio:test npm run test:cross-browser
      - run: docker run --rm playwright-qa-portfolio:test npm run test:mobile
  azure-playwright:
    if: vars.AZURE_PLAYWRIGHT_ENABLED == 'true'
    needs: repository-verification
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Run cross-browser tests in Playwright Workspaces
        env:
          PLAYWRIGHT_SERVICE_URL: ${{ secrets.PLAYWRIGHT_SERVICE_URL }}
        run: npm run test:azure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: azure-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
  regression-shards:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    strategy: { fail-fast: false, matrix: { shard: ['1/2', '2/2'] } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npx playwright test --shard=${{ matrix.shard }} --reporter=blob
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-${{ strategy.job-index }}
          path: blob-report
          retention-days: 1
  merge-reports:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: regression-shards
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { pattern: blob-*, path: all-blob-reports, merge-multiple: true }
      - run: npx playwright merge-reports --reporter=html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with: { name: merged-html-report, path: playwright-report, retention-days: 30 }
