services:
  portfolio:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:7870:80"
    volumes:
      - ${PORTFOLIO_PUBLIC_DIR:-/var/www/playwright-portfolio}:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - runner-data:/qa-runs:ro
    depends_on:
      runner:
        condition: service_healthy
  runner:
    build:
      context: ../..
      dockerfile: runner/Dockerfile
    restart: unless-stopped
    read_only: true
    init: true
    ipc: host
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - runner-data:/data
    environment:
      ALLOWED_ORIGINS: ${RUNNER_ALLOWED_ORIGINS:-https://hernan-dh.github.io,https://portfolio-hdh.duckdns.org}
      PUBLIC_RUNS_BASE: ${PUBLIC_RUNS_BASE:-/qa-runs}
      RUNNER_COOLDOWN_MS: ${RUNNER_COOLDOWN_MS:-300000}
      RUNNER_TIMEOUT_MS: ${RUNNER_TIMEOUT_MS:-120000}
      RUNNER_RETENTION_MS: ${RUNNER_RETENTION_MS:-86400000}
      RUNNER_MAX_RUNS: ${RUNNER_MAX_RUNS:-20}
      SHOWCASE_WORKERS: ${SHOWCASE_WORKERS:-2}
      npm_config_cache: /tmp/npm-cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/qa-api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
volumes:
  runner-data:
