server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
  location / { try_files $uri $uri/ =404; }
  location ~* \.(css|js|png|svg|woff2)$ { expires 7d; add_header Cache-Control "public, immutable"; }
  location = /status.json { add_header Cache-Control "no-cache"; }
  location /qa-api/ {
    proxy_pass http://runner:3000;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_read_timeout 10s;
    limit_except GET POST OPTIONS { deny all; }
  }
  location /qa-runs/ {
    alias /qa-runs/runs/;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=300";
  }
}
